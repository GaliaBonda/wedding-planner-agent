[project]
name = "wedding-planner"
version = "0.1.0"
description = "Wedding planning agent with travel, venue, and music subagents"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.3.10",
    "langchain-openai>=1.1.14",
    "langchain-mcp-adapters>=0.1.13",
    "python-dotenv>=1.2.0",
    "tavily-python>=0.7.13",
    "langgraph>=1.0.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wedding_planner"]
